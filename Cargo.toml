[package]
name = "docent-mcp"
version = "0.9.0"
edition = "2021"
rust-version = "1.97.1"

[[bin]]
name = "docent"
path = "src/main.rs"

[dependencies]
anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
arc-swap = "=1.9.2"
async-trait = "=0.1.91"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
bm25 = "=2.3.2"
bytemuck = "=1.25.2"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
dashmap = "=6.1.0"
dirs-next = "=2.0.0"
fastembed = { version = "=5.17.4", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
globset = { version = "=0.4.20", default-features = false, features = ["log"] }
notify-debouncer-full = "=0.7.0"
rmcp = { version = "=1.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
shaku = { version = "=0.6.3", default-features = false, features = ["derive", "thread_safe"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.8", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "rt", "macros", "sync", "time", "net", "signal", "io-util"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
walkdir = "=2.5.0"

[dev-dependencies]
mockall = { version = "=0.14.0", default-features = false }

[profile.dev]
debug = 1
incremental = false

[profile.dev.build-override]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
